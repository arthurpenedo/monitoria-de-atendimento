[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoria-de-atendimento"
version = "0.1.0"
description = "Checklist de monitoria de ligações de atendimento sobre transcrição: nota 0-100, trechos que justificam e feedback, medido em ligações sintéticas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arthur Penedo" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
monitoria-de-atendimento = "monitoria_de_atendimento.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
